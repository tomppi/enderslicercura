name: Export source snapshot

on:
  push:
    branches:
      - feature/expose-cura-profile-settings
    paths:
      - .github/workflows/export-source.yml
  pull_request:
    branches:
      - fix/parser-memory-lifecycle
    paths:
      - .github/workflows/export-source.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          tar -czf enderslicercura-source.tar.gz \
            app/src/main \
            app/src/test \
            app/build.gradle.kts \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties
      - uses: actions/upload-artifact@v4
        with:
          name: enderslicercura-source
          path: enderslicercura-source.tar.gz
          if-no-files-found: error
