name: Apply round 2 fixups

on:
  push:
    branches: [fix/bug-fix-round-2]
    paths: [.github/round2-fixup-trigger]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bug-fix-round-2
          fetch-depth: 0

      - name: Apply reviewed fixups
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          resolver = "app/src/main/java/com/tomppi/enderslicer/profile/CuraDefinitionResolver.kt"
          replace(
              resolver,
              '''        document.settings.forEach { (key, child) ->
            val parent = result[key]
            result[key] = SettingDefinition(
                defaultValue = child.defaultValue ?: parent?.defaultValue,
                expression = child.expression ?: parent?.expression,
                settablePerMesh = child.settablePerMesh ?: parent?.settablePerMesh,
                type = child.type ?: parent?.type,
                options = child.options ?: parent?.options,
            )
        }
''',
              '''        document.settings.forEach { (key, child) ->
            val parent = result[key]
            // Keep Cura's existing value/default override semantics: a child
            // setting replaces those fields exactly as it did before schema
            // validation was added. Only schema metadata is inherited when the
            // child omits it, so a metadata-only child cannot discard the type
            // needed to validate its result.
            result[key] = child.copy(
                settablePerMesh = child.settablePerMesh ?: parent?.settablePerMesh,
                type = child.type ?: parent?.type,
                options = child.options ?: parent?.options,
            )
        }
''',
          )
          replace(
              resolver,
              '''            val options = setting.optJSONObject("options")?.let { optionObject ->
                buildSet {
                    val optionKeys = optionObject.keys()
                    while (optionKeys.hasNext()) add(optionKeys.next())
                }
            }
''',
              '''            val options = setting.optJSONObject("options")?.let { optionObject ->
                buildSet {
                    // Cura enum objects map user-facing labels to the actual
                    // values stored in profiles and consumed by CuraEngine.
                    // Validate against those values (for example "Marlin"),
                    // not the translated labels.
                    val optionLabels = optionObject.keys()
                    while (optionLabels.hasNext()) {
                        val label = optionLabels.next()
                        val value = optionObject.opt(label)
                        if (value != null && value != JSONObject.NULL) add(value.toString())
                    }
                }
            }
''',
          )

          publisher = "app/src/main/java/com/tomppi/enderslicer/engine/SliceArtifactPublisher.kt"
          replace(
              publisher,
              '''            if (!marker.isFile || marker.readText().trim() != directory.name) return false
''',
              '''            if (!marker.isFile || runCatching { marker.readText().trim() == directory.name }.getOrDefault(false).not()) return false
''',
          )

          gradle = "app/build.gradle.kts"
          replace(
              gradle,
              '''    inputs.file(curaEngineExecutable)

    doLast {
''',
              '''    // Do not declare a mandatory input here: Gradle would emit a
    // generic missing-input validation error before our actionable diagnostic.
    outputs.upToDateWhen { false }

    doLast {
''',
          )

          workflow = ".github/workflows/build.yml"
          replace(
              workflow,
              '''          gradle :app:assembleDebug --stacktrace 2>&1 | tee apk-build.log
''',
              '''          gradle :app:verifyDebugApkContents --stacktrace 2>&1 | tee apk-build.log
''',
          )

          repo = "app/src/main/java/com/tomppi/enderslicer/octoprint/OctoPrintRepository.kt"
          replace(
              repo,
              '''        val remoteName = sanitizeGcodeName(suggestedName.ifBlank { source.name })
        val requestGeneration = generation
        _state.update {
''',
              '''        val remoteName = sanitizeGcodeName(suggestedName.ifBlank { source.name })
        val requestGeneration = generation
        val sourceLease = runCatching { SliceArtifactPublisher.acquireLease(source) }.getOrElse { error ->
            setError(error)
            return
        }
        _state.update {
''',
          )
          replace(
              repo,
              '''        sessionScope.launch {
            runCatching {
                withContext(Dispatchers.IO) {
                    val uploadSource = SliceArtifactPublisher.acquireLease(source).use {
                        snapshotGcodeForUpload(source)
                    }
''',
              '''        val uploadJob = sessionScope.launch {
            runCatching {
                withContext(Dispatchers.IO) {
                    val uploadSource = snapshotGcodeForUpload(source)
''',
          )
          replace(
              repo,
              '''            }.onFailure { error ->
                if (!isCurrent(requestGeneration) || error is CancellationException) return@onFailure
                _state.update { it.copy(isUploading = false, uploadProgress = null) }
                handleSessionError(error, requestGeneration, forbiddenMeansInvalidKey = false)
            }
        }
    }

    fun selectFile''',
              '''            }.onFailure { error ->
                if (!isCurrent(requestGeneration) || error is CancellationException) return@onFailure
                _state.update { it.copy(isUploading = false, uploadProgress = null) }
                handleSessionError(error, requestGeneration, forbiddenMeansInvalidKey = false)
            }
        }
        // Covers cancellation before the coroutine body reaches its own cleanup.
        // Closing twice is harmless: lease deletion and released-artifact cleanup
        // are both idempotent.
        uploadJob.invokeOnCompletion { sourceLease.close() }
    }

    fun selectFile''',
          )
          PY

      - name: Commit fixups
        run: |
          rm -f .github/round2-fixup-trigger .github/workflows/apply-round2-fixups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve Cura inheritance and build diagnostics"
          git push origin HEAD:fix/bug-fix-round-2
