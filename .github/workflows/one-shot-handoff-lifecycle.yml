name: Apply one-shot handoff lifecycle patch

on:
  push:
    branches:
      - fix/parser-memory-lifecycle
    paths:
      - .github/workflows/one-shot-handoff-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parser-memory-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source patch
        run: python3 scripts/apply_handoff_lifecycle_patch.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_handoff_lifecycle_patch.py
          rm .github/workflows/one-shot-handoff-lifecycle.yml
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix: restore workspace and resilient UI lifecycle'
          git push origin HEAD:fix/parser-memory-lifecycle
