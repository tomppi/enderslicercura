name: Validate handoff lifecycle patch

on:
  push:
    branches:
      - fix/parser-memory-lifecycle
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch in disposable checkout
        id: patch
        shell: bash
        run: |
          set +e
          tar -czf handoff-original-sources.tar.gz \
            app/src/main/java/com/tomppi/enderslicer/data/WorkspaceStateStore.kt \
            app/src/main/java/com/tomppi/enderslicer/viewer/ModelSurfaceView.kt \
            app/src/main/java/com/tomppi/enderslicer/engine/CuraEngineRunner.kt \
            app/src/main/java/com/tomppi/enderslicer/ui/LayerPreviewView.kt \
            app/src/main/java/com/tomppi/enderslicer/ui/IntegratedEnderSlicerApp.kt \
            app/src/main/java/com/tomppi/enderslicer/ui/EnderSlicerApp.kt \
            app/src/main/java/com/tomppi/enderslicer/ui/MainViewModel.kt \
            app/src/main/java/com/tomppi/enderslicer/model/PlanarPatchSelector.kt
          python3 scripts/prepare_handoff_patcher.py > handoff-patch-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 scripts/apply_handoff_lifecycle_patch.py >> handoff-patch-output.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python3 scripts/finalize_handoff_patched_sources.py >> handoff-patch-output.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python3 scripts/package_handoff_patched_sources.py >> handoff-patch-output.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            tar -czf handoff-patched-tree.tar.gz app/src/main/java app/src/test app/build.gradle.kts build.gradle.kts
          else
            cp handoff-patch-output.txt handoff-patch-error.txt
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload guarded patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enderslicercura-handoff-patch
          path: |
            handoff-patch-output.txt
            handoff-patch-error.txt
            handoff-patched-sources.b64
            handoff-original-sources.tar.gz
            handoff-patched-tree.tar.gz
          if-no-files-found: error
      - name: Require exact guarded patch
        run: test "${{ steps.patch.outputs.status }}" -eq 0
