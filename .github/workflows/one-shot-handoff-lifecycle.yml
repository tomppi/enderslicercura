name: Publish reviewed handoff sources

on:
  push:
    branches:
      - fix/parser-memory-lifecycle

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parser-memory-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed guarded source edits
        run: |
          python3 scripts/prepare_handoff_patcher.py
          python3 scripts/apply_handoff_lifecycle_patch.py
          python3 scripts/finalize_handoff_patched_sources.py
          python3 scripts/finalize_handoff_ui_drafts.py
      - name: Remove temporary patch infrastructure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          root.joinpath('build.gradle.kts').write_text('''plugins {
              id("com.android.application") version "9.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          ''')

          workflow = root / '.github/workflows/build.yml'
          content = workflow.read_text()
          content, count = re.subn(
              r'''\n      - name: Upload handoff patch diagnostic\n.*?\n      - name: Build and package CuraEngine ARM64\n''',
              '\n      - name: Build and package CuraEngine ARM64\n',
              content,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise RuntimeError(f'Expected one diagnostic workflow block, found {count}')
          content = content.replace('            handoff-patch-error.txt\n', '')
          content = content.replace('            handoff-patched-sources.b64\n', '')
          workflow.write_text(content)
          PY
          rm scripts/prepare_handoff_patcher.py
          rm scripts/apply_handoff_lifecycle_patch.py
          rm scripts/finalize_handoff_patched_sources.py
          rm scripts/finalize_handoff_ui_drafts.py
          rm scripts/package_handoff_patched_sources.py
          rm .github/workflows/one-shot-handoff-lifecycle.yml
      - name: Commit reviewed sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: restore workspace and resilient UI lifecycle'
          git push origin HEAD:fix/parser-memory-lifecycle
