name: Apply native arc overhang

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-arc-diagnostic-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-native-arc:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/native-arc-overhang'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-arc-overhang
          fetch-depth: 1

      - name: Apply or record exact failure
        shell: bash
        run: |
          set -uo pipefail
          if [[ -f .agent-native-arc/apply-log.txt ]]; then
            echo 'Existing diagnostic log retained; waiting for source correction.'
            exit 0
          fi

          cp .github/workflows/build.yml /tmp/arc-installer.yml
          cp .agent-native-arc/build.yml.base .github/workflows/build.yml
          rm -f .agent-native-arc/diagnostics.txt

          set +e
          {
            set -x
            cat .agent-native-arc/part-*.b64 | tr -d '[:space:]' > .agent-native-arc/patch.b64
            echo '684a0eb1ca2c9ad05d064202574e225b094e5a7246578d24915577b3803c3512  .agent-native-arc/patch.b64' | sha256sum -c -
            base64 --decode .agent-native-arc/patch.b64 > .agent-native-arc/patch.py
            echo '0c06709898ed30a668e26edff374e1272c5892fac023cb6a105e7a621ba3ee46  .agent-native-arc/patch.py' | sha256sum -c -
            python3 -m py_compile .agent-native-arc/patch.py
            python3 .agent-native-arc/patch.py
          } > /tmp/arc-apply-log.txt 2>&1
          status=$?
          set -e

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [[ $status -ne 0 ]]; then
            git reset --hard HEAD
            cp /tmp/arc-installer.yml .github/workflows/build.yml
            cp /tmp/arc-apply-log.txt .agent-native-arc/apply-log.txt
            rm -f .agent-native-arc/patch.b64 .agent-native-arc/patch.py
            git add .agent-native-arc/apply-log.txt .github/workflows/build.yml
            git commit -m 'Record native arc installer failure'
            git push origin HEAD:agent/native-arc-overhang
            cat .agent-native-arc/apply-log.txt
            exit $status
          fi

          rm -rf .agent-native-arc
          rm -f .github/workflows/apply-native-arc-overhang.yml
          git add -A
          git commit -m 'Port native Multiplex arc overhangs to CuraEngine'
          git push origin HEAD:agent/native-arc-overhang
