name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-curvislicer-round-two-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/non-planar-curvislicer
          fetch-depth: 2

      - name: Apply reviewed repair payload
        run: |
          set -euo pipefail
          base64 --decode tools/curvislicer-round2-fixes.py.gz.b64 | gzip --decompress > tools/apply_curvislicer_round2_fixes.py
          python3 -m py_compile tools/apply_curvislicer_round2_fixes.py
          python3 tools/apply_curvislicer_round2_fixes.py

      - name: Restore workflow and commit source fixes
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f tools/curvislicer-round2-fixes.py.gz.b64
          rm -f tools/apply_curvislicer_round2_fixes.py
          rm -f .github/workflows/apply-curvislicer-round2-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve CurviSlicer round-two audit findings"
          git push origin HEAD:feature/non-planar-curvislicer
