name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: general-audit-fix-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-general-audit-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/non-planar-curvislicer
          fetch-depth: 5

      - name: Apply reviewed general-audit fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_general_audit_fixes.py')
          text = path.read_text()
          helper_marker = "def regex_once(path, pattern, replacement, flags=0):\n"
          helper = """def replace_first(path, old, new):
              text = read(path)
              if old not in text:
                  raise RuntimeError(f'{path}: expected at least one match: {old[:160]!r}')
              write(path, text.replace(old, new, 1))

          """
          if 'def replace_first' not in text:
              text = text.replace(helper_marker, helper + helper_marker, 1)

          preview_old = """replace_once(
              'app/src/main/java/com/tomppi/enderslicer/engine/GcodeLayerPreview.kt',
              '''                val command = GcodeCommand.parse(rawLine) ?: return@forEach\\n                if (modalState.apply(command)) return@forEach\\n''',
          """
          if preview_old not in text:
              raise RuntimeError('Unable to narrow the layer-preview replacement')
          text = text.replace(preview_old, preview_old.replace('replace_once(', 'replace_first(', 1), 1)

          begin_old = """    '''        if (current.isBusy) return false\\n        _uiState.update { it.copy(isBusy = true, statusMessage = message) }\\n''',
          """
          begin_new = """    '''        if (_uiState.value.isBusy) return false\\n        _uiState.update { it.copy(isBusy = true, statusMessage = message) }\\n''',
          """
          if begin_old not in text:
              raise RuntimeError('Unable to align the beginOperation replacement')
          path.write_text(text.replace(begin_old, begin_new, 1))
          PY
          python3 -m py_compile tools/apply_general_audit_fixes.py
          python3 tools/apply_general_audit_fixes.py

      - name: Restore workflow and commit source fixes
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f tools/apply_general_audit_fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve general application audit findings"
          git push origin HEAD:feature/non-planar-curvislicer
