name: Publish Cura settings implementation

on:
  push:
    branches:
      - feature/expose-cura-profile-settings
  pull_request:
    branches:
      - fix/parser-memory-lifecycle

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expose-cura-profile-settings
          fetch-depth: 0

      - name: Apply reviewed implementation
        run: |
          git apply --recount --3way scripts/expose-cura-settings.patch
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          test -n "$(git status --short app/src/main app/src/test)"

      - name: Restore normal CI and remove one-shot files
        run: |
          git fetch origin fix/parser-memory-lifecycle
          git show origin/fix/parser-memory-lifecycle:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f .github/workflows/export-source.yml
          rm -f .cura-settings-publish-trigger
          rm -f scripts/expose-cura-settings.patch
          rm -f scripts/cura-settings-source.tar.gz.b64
          rm -f scripts/cura-settings-source.part00 scripts/cura-settings-source.part01 scripts/cura-settings-source.part02 scripts/cura-settings-source.part03
          rm -f scripts/cura-settings-piece00 scripts/cura-settings-piece01 scripts/cura-settings-piece02 scripts/cura-settings-piece03
          rm -f scripts/cura-settings-piece04 scripts/cura-settings-piece05 scripts/cura-settings-piece06 scripts/cura-settings-piece07

      - name: Publish source commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: expose imported Cura profile settings'
          git push origin HEAD:feature/expose-cura-profile-settings
