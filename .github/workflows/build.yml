name: Apply native arc overhang

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-arc-diagnostic-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-native-arc:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/native-arc-overhang'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-arc-overhang
          fetch-depth: 1

      - name: Apply native Multiplex port
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cp .github/workflows/build.yml /tmp/native-arc-installer.yml
          cp .agent-native-arc/build.yml.base .github/workflows/build.yml
          rm -f .agent-native-arc/diagnostics.txt

          set +e
          {
            set -x
            cat .agent-native-arc/part-*.b64 | tr -d '[:space:]' > .agent-native-arc/patch.b64
            echo '6f97c63d73e0805c6caa80df38a1d2ef604825a750e61654b350f1480130f988  .agent-native-arc/patch.b64' | sha256sum -c -
            base64 --decode .agent-native-arc/patch.b64 > .agent-native-arc/patch.py
            echo '26a3bb83757e977771b44c0f4177f905221763d3db165c5c6369a7d83c601085  .agent-native-arc/patch.py' | sha256sum -c -
            python3 -m py_compile .agent-native-arc/patch.py
            python3 .agent-native-arc/patch.py
          } > /tmp/arc-apply-log.txt 2>&1
          status=$?
          set -e
          echo "$status" > /tmp/arc-apply-status.txt
          exit "$status"

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-arc-installer-diagnostics
          path: |
            /tmp/arc-apply-log.txt
            /tmp/arc-apply-status.txt
          if-no-files-found: error

      - name: Commit native port source
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/native-arc-installer.yml .github/workflows/build.yml
          rm -rf .agent-native-arc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Port native Multiplex arc overhangs to CuraEngine'
          git push origin HEAD:agent/native-arc-overhang

      - name: Fail after diagnostics
        if: steps.apply.outcome != 'success'
        shell: bash
        run: |
          cat /tmp/arc-apply-log.txt
          exit 1
