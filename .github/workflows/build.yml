name: Publish Cura settings implementation

on:
  push:
    branches:
      - feature/expose-cura-profile-settings
  pull_request:
    branches:
      - fix/parser-memory-lifecycle

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expose-cura-profile-settings
          fetch-depth: 0
      - name: Verify reviewed source bundle
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib

          expected = {
              'scripts/cura-settings-source.part00': (14000, 'd2541b5667e541fa6bcf451ceb11268568772544f69021dbc03024065c3549bc'),
              'scripts/cura-settings-source.part01': (14000, '60c1c5382be8f40356d4a36b88688e1a89ce7ca136d8d00a086c0ec34611cc20'),
              'scripts/cura-settings-source.part02': (14000, '9148f7fcb6a7a07a94d5de45f3148695c8eee85680caf4fcb9e12ea746891023'),
              'scripts/cura-settings-source.part03': (11900, 'f916ae5187be341dcacd0996fc7c26d4fb0a7c54a1adb0e46fd2141f3c84e934'),
          }
          errors = []
          parts = []
          for name, (expected_size, expected_digest) in expected.items():
              data = pathlib.Path(name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              print(f'{name}: bytes={len(data)} sha256={digest}')
              if len(data) != expected_size or digest != expected_digest:
                  errors.append(name)
              parts.append(data)
          joined = b''.join(parts)
          joined_digest = hashlib.sha256(joined).hexdigest()
          print(f'joined base64: bytes={len(joined)} sha256={joined_digest}')
          if len(joined) != 53900 or joined_digest != 'f6ee35764f1024d29d4bdd336f4f25db4451d8e884a82722c922fc55103adf25':
              errors.append('joined base64')
          if errors:
              raise SystemExit('Verification failed: ' + ', '.join(errors))
          archive = base64.b64decode(joined, validate=True)
          archive_digest = hashlib.sha256(archive).hexdigest()
          print(f'decoded archive: bytes={len(archive)} sha256={archive_digest}')
          if archive_digest != 'a50fd5582586e903d3375ae1f89a8a22e34cb2b9a62df515667fdf659de01a06':
              raise SystemExit('Decoded archive checksum mismatch')
          pathlib.Path('/tmp/cura-settings-source.tar.gz').write_bytes(archive)
          PY
      - name: Validate archive paths and extract
        run: |
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/cura-settings-source.tar.gz')
          root = pathlib.Path.cwd().resolve()
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'Unsupported archive entry: {member.name}')
              bundle.extractall(root, members=members, filter='data')
          print(f'Extracted {len(members)} reviewed files')
          PY
      - name: Validate source diff
        run: |
          git status --short
          if ! git diff --check > /tmp/diff-check.log 2>&1; then
            cat /tmp/diff-check.log
            exit 1
          fi
          test -n "$(git status --short app/src/main app/src/test)"
          echo 'Reviewed source diff is clean'
      - name: Restore normal CI and remove one-shot files
        run: |
          git fetch origin fix/parser-memory-lifecycle
          git show origin/fix/parser-memory-lifecycle:.github/workflows/build.yml > .github/workflows/build.yml
          rm -f .github/workflows/export-source.yml
          rm -f .cura-settings-publish-trigger
          rm -f scripts/expose-cura-settings.patch
          rm -f scripts/cura-settings-source.tar.gz.b64
          rm -f scripts/cura-settings-source.part00
          rm -f scripts/cura-settings-source.part01
          rm -f scripts/cura-settings-source.part02
          rm -f scripts/cura-settings-source.part03
      - name: Publish source commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: expose imported Cura profile settings'
          git push origin HEAD:feature/expose-cura-profile-settings
