name: Apply arc preview color

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-preview-color-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/native-arc-overhang'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-arc-overhang
          fetch-depth: 2

      - name: Apply and commit preview classification
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'ARC_OVERHANG(5)' app/src/main/java/com/tomppi/enderslicer/engine/GcodeLayerPreview.kt; then
            echo 'Arc preview color patch is already applied.'
            exit 0
          fi

          cp .github/workflows/build.yml /tmp/arc-preview-apply.yml
          git show HEAD^:.github/workflows/build.yml > .github/workflows/build.yml
          python3 -m py_compile scripts/apply-arc-preview-color.py
          python3 scripts/apply-arc-preview-color.py
          cp /tmp/arc-preview-apply.yml .github/workflows/build.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/build-curaengine-android.sh \
            app/src/main/java/com/tomppi/enderslicer/engine/GcodeLayerPreview.kt \
            app/src/main/java/com/tomppi/enderslicer/viewer/LayerPreviewSurfaceView.kt \
            app/src/main/java/com/tomppi/enderslicer/ui/LayerPreviewView.kt \
            app/src/test/java/com/tomppi/enderslicer/engine/GcodeLayerPreviewParserTest.kt
          git commit -m 'Color native arc overhangs in layer preview'
          git push origin HEAD:agent/native-arc-overhang
