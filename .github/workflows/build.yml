name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-fix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply-compile-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/non-planar-curvislicer
          fetch-depth: 4

      - name: Apply demonstrated compile fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          storage = Path('app/src/main/java/com/tomppi/enderslicer/nonplanar/CurviSlicerFieldStorage.kt')
          text = storage.read_text()
          marker = '    private fun read(file: File): CurviSlicerPipeline.Prepared =\n'
          addition = '    fun isPrepared(workspace: File): Boolean = File(workspace, FILE_NAME).isFile\n\n' + marker
          if text.count(marker) != 1:
              raise RuntimeError('CurviSlicerFieldStorage read boundary mismatch')
          storage.write_text(text.replace(marker, addition, 1))

          view_model = Path('app/src/main/java/com/tomppi/enderslicer/ui/MainViewModel.kt')
          text = view_model.read_text()
          old = '    private fun beginOperation(message: String): Boolean {\n        if (current.isBusy) return false\n'
          new = '    private fun beginOperation(message: String): Boolean {\n        if (_uiState.value.isBusy) return false\n'
          if text.count(old) != 1:
              raise RuntimeError('MainViewModel beginOperation boundary mismatch')
          view_model.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source-only fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/tomppi/enderslicer/nonplanar/CurviSlicerFieldStorage.kt \
                  app/src/main/java/com/tomppi/enderslicer/ui/MainViewModel.kt
          git diff --cached --check
          git commit -m "fix: correct general audit compile wiring"
          git push origin HEAD:feature/non-planar-curvislicer
