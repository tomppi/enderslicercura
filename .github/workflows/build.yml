name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # ROUND2_PUBLISHER_START
      - name: Publish reviewed round 2 source fixups
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/bug-fix-round-2'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          resolver = "app/src/main/java/com/tomppi/enderslicer/profile/CuraDefinitionResolver.kt"
          replace(resolver, '''        document.settings.forEach { (key, child) ->
            val parent = result[key]
            result[key] = SettingDefinition(
                defaultValue = child.defaultValue ?: parent?.defaultValue,
                expression = child.expression ?: parent?.expression,
                settablePerMesh = child.settablePerMesh ?: parent?.settablePerMesh,
                type = child.type ?: parent?.type,
                options = child.options ?: parent?.options,
            )
        }
''', '''        document.settings.forEach { (key, child) ->
            val parent = result[key]
            // Keep Cura's existing value/default override semantics. Only
            // schema metadata is inherited when the child omits it.
            result[key] = child.copy(
                settablePerMesh = child.settablePerMesh ?: parent?.settablePerMesh,
                type = child.type ?: parent?.type,
                options = child.options ?: parent?.options,
            )
        }
''')
          replace(resolver, '''            val options = setting.optJSONObject("options")?.let { optionObject ->
                buildSet {
                    val optionKeys = optionObject.keys()
                    while (optionKeys.hasNext()) add(optionKeys.next())
                }
            }
''', '''            val options = setting.optJSONObject("options")?.let { optionObject ->
                buildSet {
                    // Cura maps translated labels to the actual values stored
                    // in profiles and consumed by CuraEngine.
                    val optionLabels = optionObject.keys()
                    while (optionLabels.hasNext()) {
                        val label = optionLabels.next()
                        val value = optionObject.opt(label)
                        if (value != null && value != JSONObject.NULL) add(value.toString())
                    }
                }
            }
''')

          publisher = "app/src/main/java/com/tomppi/enderslicer/engine/SliceArtifactPublisher.kt"
          replace(publisher, '''            if (!marker.isFile || marker.readText().trim() != directory.name) return false
''', '''            if (!marker.isFile || !runCatching { marker.readText().trim() == directory.name }.getOrDefault(false)) return false
''')

          gradle = "app/build.gradle.kts"
          replace(gradle, '''    inputs.file(curaEngineExecutable)

    doLast {
''', '''    // Keep the actionable failure below instead of allowing Gradle to
    // emit a generic missing-input validation error first.
    outputs.upToDateWhen { false }

    doLast {
''')

          repo = "app/src/main/java/com/tomppi/enderslicer/octoprint/OctoPrintRepository.kt"
          replace(repo, '''        val remoteName = sanitizeGcodeName(suggestedName.ifBlank { source.name })
        val requestGeneration = generation
        _state.update {
''', '''        val remoteName = sanitizeGcodeName(suggestedName.ifBlank { source.name })
        val requestGeneration = generation
        val sourceLease = runCatching { SliceArtifactPublisher.acquireLease(source) }.getOrElse { error ->
            setError(error)
            return
        }
        _state.update {
''')
          replace(repo, '''        sessionScope.launch {
            runCatching {
                withContext(Dispatchers.IO) {
                    val uploadSource = SliceArtifactPublisher.acquireLease(source).use {
                        snapshotGcodeForUpload(source)
                    }
''', '''        val uploadJob = sessionScope.launch {
            runCatching {
                withContext(Dispatchers.IO) {
                    val uploadSource = snapshotGcodeForUpload(source)
''')
          replace(repo, '''            }.onFailure { error ->
                if (!isCurrent(requestGeneration) || error is CancellationException) return@onFailure
                _state.update { it.copy(isUploading = false, uploadProgress = null) }
                handleSessionError(error, requestGeneration, forbiddenMeansInvalidKey = false)
            }
        }
    }

    fun selectFile''', '''            }.onFailure { error ->
                if (!isCurrent(requestGeneration) || error is CancellationException) return@onFailure
                _state.update { it.copy(isUploading = false, uploadProgress = null) }
                handleSessionError(error, requestGeneration, forbiddenMeansInvalidKey = false)
            }
        }
        uploadJob.invokeOnCompletion { sourceLease.close() }
    }

    fun selectFile''')

          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text().replace(
              '          gradle :app:assembleDebug --stacktrace 2>&1 | tee apk-build.log\n',
              '          gradle :app:verifyDebugApkContents --stacktrace 2>&1 | tee apk-build.log\n',
              1,
          )
          start = text.index('      # ROUND2_PUBLISHER_START\n')
          end_marker = '      # ROUND2_PUBLISHER_END\n'
          end = text.index(end_marker, start) + len(end_marker)
          workflow.write_text(text[:start] + text[end:])
          PY

          rm -f \
            .github/round2-fixup-trigger \
            .github/workflows/apply-round2-fixups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve Cura inheritance and build diagnostics"
          git push origin HEAD:fix/bug-fix-round-2
      # ROUND2_PUBLISHER_END

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and native build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y ninja-build file binutils

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-curaengine-5.11-beta1-android-arm64-v5-${{ hashFiles('scripts/build-curaengine-android.sh', 'native/curaengine/profiles/android-arm64') }}
          restore-keys: |
            conan-curaengine-5.11-beta1-android-arm64-v5-
            conan-curaengine-5.11-android-arm64-v4-

      - name: Fetch and validate pinned Cura definitions
        run: |
          chmod +x scripts/fetch-cura-resources.sh
          scripts/fetch-cura-resources.sh
          grep -q 'Cura resources: 5.11.0-beta.1' app/src/main/assets/cura/definitions/version.txt
          for name in \
            fdmprinter \
            fdmextruder \
            creality_base \
            creality_base_extruder_0 \
            creality_ender3; do
            test -s "app/src/main/assets/cura/definitions/$name.def.json"
          done

      - name: Prepare and validate pinned BumpMesh workspace
        run: |
          gradle :app:prepareBumpMeshAssets --stacktrace
          test -s app/src/main/assets/bumpmesh/index.html
          test -s app/src/main/assets/bumpmesh/LICENSE
          test -s app/src/main/assets/bumpmesh/android-bridge.js
          test -s app/src/main/assets/bumpmesh/vendor/three/build/three.module.js
          test -s app/src/main/assets/bumpmesh/vendor/three/LICENSE
          test -s app/src/main/assets/bumpmesh/vendor/fflate/esm/browser.js
          test -s app/src/main/assets/bumpmesh/vendor/fflate/LICENSE
          test -s app/src/main/assets/bumpmesh/vendor/meshstep/dist/index.js
          test -s app/src/main/assets/bumpmesh/vendor/meshstep/src/index.ts
          test -s app/src/main/assets/bumpmesh/vendor/meshstep/LICENSE
          grep -q 'format=2' app/src/main/assets/bumpmesh/.source-version
          grep -q 'BumpMesh=a6ac179149b8a17c71a9469dd4cb6f866c0c01d1' app/src/main/assets/bumpmesh/.source-version
          grep -q './vendor/three/build/three.module.js' app/src/main/assets/bumpmesh/index.html
          grep -q 'android-bridge.js' app/src/main/assets/bumpmesh/index.html
          grep -q '../vendor/meshstep/dist/index.js' app/src/main/assets/bumpmesh/js/stepWorker.js
          grep -q '../vendor/three/build/three.module.js' app/src/main/assets/bumpmesh/js/threeCompat.js
          ! grep -R 'https://cdn.jsdelivr.net/npm' \
            app/src/main/assets/bumpmesh/index.html \
            app/src/main/assets/bumpmesh/js

      - name: Build and package CuraEngine ARM64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          APP_JNILIBS_DIR: ${{ github.workspace }}/app/src/main/jniLibs
        run: |
          chmod +x scripts/build-curaengine-android.sh
          set -o pipefail
          scripts/build-curaengine-android.sh 2>&1 | tee curaengine-android-build.log
          grep -q 'CuraEngine Android artifacts (5.11.0-beta.1)' curaengine-android-build.log
          grep -q 'EnderSlicer: Cura.*frontend applies the complete affine' .build/CuraEngine/src/communication/CommandLine.cpp
          grep -q 'EnderSlicer: resolved model values must live on the' .build/CuraEngine/src/communication/CommandLine.cpp
          grep -q 'EnderSlicer: zero cool_min_temperature is a Cura frontend sentinel' .build/CuraEngine/src/LayerPlanBuffer.cpp
          grep -q "Preserve the generator's inner-to-outer order" .build/CuraEngine/src/FffGcodeWriter.cpp
          grep -q 'One centre is retained for the complete connected island' .build/CuraEngine/include/ArcOverhang.h
          grep -q 'TYPE:ARC-OVERHANG' .build/CuraEngine/src/LayerPlan.cpp
          grep -q 'is_arc_overhang' .build/CuraEngine/include/GCodePathConfig.h
          test -s .build/CuraEngine/src/ArcOverhang.cpp
          test -s app/src/main/jniLibs/arm64-v8a/libcuraengine_exec.so
          file app/src/main/jniLibs/arm64-v8a/libcuraengine_exec.so
          readelf -d app/src/main/jniLibs/arm64-v8a/libcuraengine_exec.so | tee curaengine-needed.log
          ! grep -q 'libc++_shared.so' curaengine-needed.log

      - name: Unit tests and complete definition audit
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee apk-build.log
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.log
          grep -q 'lib/arm64-v8a/libcuraengine_exec.so' apk-contents.log
          grep -q 'assets/cura/definitions/version.txt' apk-contents.log
          grep -q 'assets/bumpmesh/index.html' apk-contents.log
          grep -q 'assets/bumpmesh/LICENSE' apk-contents.log
          grep -q 'assets/bumpmesh/android-bridge.js' apk-contents.log
          grep -q 'assets/bumpmesh/vendor/three/build/three.module.js' apk-contents.log
          grep -q 'assets/bumpmesh/vendor/meshstep/src/index.ts' apk-contents.log
          grep -q 'assets/bumpmesh/vendor/meshstep/LICENSE' apk-contents.log
          for name in \
            fdmprinter \
            fdmextruder \
            creality_base \
            creality_base_extruder_0 \
            creality_ender3; do
            grep -q "assets/cura/definitions/$name.def.json" apk-contents.log
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: enderslicercura-0.9.0-dev-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enderslicercura-build-logs
          path: |
            curaengine-android-build.log
            curaengine-needed.log
            unit-tests.log
            apk-build.log
            apk-contents.log
          if-no-files-found: ignore
