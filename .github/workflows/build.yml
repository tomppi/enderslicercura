name: Fix native arc source

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-arc-source-fix-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/native-arc-overhang'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-arc-overhang
          fetch-depth: 1

      - name: Correct staged bridge condition
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-curaengine-android.sh')
          text = path.read_text()
          broken = 'if (angle > -1 || (support_threshold > 0 && (bridge_supported_skin_regions.area() / (skin_part.skin_fill.area() + 1) < support_threshold)))d)))'
          fixed = 'if (angle > -1 || (support_threshold > 0 && (bridge_supported_skin_regions.area() / (skin_part.skin_fill.area() + 1) < support_threshold)))'
          if broken not in text:
              raise SystemExit('Broken bridge condition was not found')
          path.write_text(text.replace(broken, fixed, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-curaengine-android.sh
          git commit -m 'Fix native arc bridge condition'
          git push origin HEAD:agent/native-arc-overhang
