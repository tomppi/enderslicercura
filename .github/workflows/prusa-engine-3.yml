name: Build PrusaSlicer 3.0.0-alpha11 Android

on:
  push:
    branches: [ 'feature/prusa-engine-android' ]
    paths:
      - '.github/workflows/prusa-engine-3.yml'
      - 'scripts/build-prusa-engine-android-3.sh'
  workflow_dispatch:
    inputs:
      abi:
        description: 'Android ABI'
        type: choice
        default: arm64-v8a
        options: [ arm64-v8a, x86_64 ]

jobs:
  build-prusa3:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, x86_64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and native tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake curl tar perl python3 autoconf automake libtool m4 make
          echo ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          echo ANDROID_HOME=$ANDROID_HOME
      - name: Build PrusaSlicer 3.0.0-alpha11 console for ${{ matrix.abi }}
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x scripts/build-prusa-engine-android-3.sh
          set -o pipefail
          scripts/build-prusa-engine-android-3.sh 2>&1 | tee prusa3-build.log
      - name: Upload PrusaSlicer 3.0.0-alpha11 Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-3.0.0-alpha11-android-${{ matrix.abi }}
          if-no-files-found: ignore
          path: |
            prusa3-build/out/**
            prusa3-build.log
