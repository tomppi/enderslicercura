name: Build PrusaSlicer Android ARM64

on:
  push:
    branches: [ 'feature/prusa-engine-android' ]
  workflow_dispatch:

jobs:
  build-prusa:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and native tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake curl tar qemu-user-static
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cmake --version
          ninja --version
      - name: Build PrusaSlicer 2.9.6 console for arm64-v8a
        run: |
          chmod +x scripts/build-prusa-engine-android.sh
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -d $ANDROID_NDK_HOME || true
          set -o pipefail
          scripts/build-prusa-engine-android.sh 2>&1 | tee prusa-android-build.log
      - name: Upload PrusaSlicer Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-2.9.6-android-arm64
          if-no-files-found: ignore
          path: |
            prusa-build/out/**
            prusa-android-build.log
