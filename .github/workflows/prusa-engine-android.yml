name: Build PrusaSlicer Android ARM64

on:
  push:
    branches: [ 'feature/prusa-engine-android' ]
    paths:
      - '.github/workflows/prusa-engine-android.yml'
      - 'scripts/build-prusa-engine-android.sh'
  workflow_dispatch:

jobs:
  build-prusa:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and native tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake curl tar
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cmake --version
          ninja --version
      - name: Build PrusaSlicer 2.9.6 console for arm64-v8a
        run: |
          chmod +x scripts/build-prusa-engine-android.sh
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -d $ANDROID_NDK_HOME || true
          set -o pipefail
          scripts/build-prusa-engine-android.sh 2>&1 | tee prusa-android-build.log
      - name: Upload PrusaSlicer Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-2.9.6-android-arm64
          if-no-files-found: ignore
          path: |
            prusa-build/out/**
            prusa-android-build.log
      - name: Upload PrusaSlicer build log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prusa-build-log
          if-no-files-found: ignore
          path: prusa-android-build.log
      - name: Save build log into repo on failure
        if: failure()
        run: |
          [ -f prusa-android-build.log ] || { echo lost > prusa-android-build.log; }
          python3 - <<'PY'
          import base64, json, os, time, pathlib, urllib.request
          p = pathlib.Path('prusa-android-build.log')
          b64 = base64.b64encode(p.read_bytes()).decode()
          name = '.build-artifacts/prusa-ci-log-%d.txt' % int(time.time())
          payload = json.dumps({
            'message': 'ci: snapshot of failed Prusa engine build log',
            'content': b64,
            'branch': 'feature/prusa-engine-android',
          }).encode()
          req = urllib.request.Request(
            'https://api.github.com/repos/%s/contents/%s' % (os.environ['GITHUB_REPOSITORY'], name),
            data=payload, method='PUT',
            headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as resp:
                  print(resp.status, name)
          except Exception as exc:
              print('SNAPSHOT-FAILED:', type(exc).__name__, str(exc)[:300])
              raise
          PY
      - name: Publish stripped engine into the repo
        run: |
          set -euo pipefail
          DEST="${GITHUB_WORKSPACE}/.build-artifacts/prusa-engine"
          BIN="${GITHUB_WORKSPACE}/prusa-build/out/prusa-slicer"
          RESDIR="${GITHUB_WORKSPACE}/prusa-build/out/resources"
          test -s "$BIN"
          test -f "$RESDIR/profiles/Anker.ini"
          mkdir -p "$DEST"
          STRIP=""
          for CAND in \
            "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            "${ANDROID_SDK_ROOT}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            "${ANDROID_HOME}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"; do
            if [ -n "$CAND" ] && [ -x "$CAND" ]; then STRIP="$CAND"; break; fi
          done
          [ -x "$STRIP" ] || { echo "llvm-strip not found for the engine binary"; exit 1; }
          "$STRIP" -s "$BIN" -o "$DEST/prusa-slicer"
          ( cd "${GITHUB_WORKSPACE}/prusa-build/out" && zip -qr "$DEST/resources.zip" resources )
          python3 - <<'PY'
          import base64, json, os, urllib.request
          for name in ('prusa-slicer', 'resources.zip'):
              path = '.build-artifacts/prusa-engine/' + name
              data = open(path, 'rb').read()
              print(name, len(data), 'bytes')
              payload = json.dumps({
                'message': 'ci: prusa engine artifact refresh (' + name + ')',
                'content': base64.b64encode(data).decode(),
                'branch': 'feature/prusa-engine-android',
              }).encode()
              req = urllib.request.Request(
                'https://api.github.com/repos/%s/contents/%s' % (os.environ['GITHUB_REPOSITORY'], path),
                data=payload, method='PUT',
                headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                         'Accept': 'application/vnd.github+json',
                         'Content-Type': 'application/json'})
              with urllib.request.urlopen(req) as resp:
                  print(resp.status, path)
          PY
