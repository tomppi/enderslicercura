name: Apply final calibration safety patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calibration-retraction-size
          fetch-depth: 0
      - name: Patch calibration state lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          vm = 'app/src/main/java/com/tomppi/enderslicer/ui/MainViewModel.kt'
          replace_once(vm,
          '''                val settings = if (result.requiresFirmwareRetraction && !snapshot.settings.firmwareRetraction) {
                    snapshot.settings.copy(
                        firmwareRetraction = true,
                        overriddenSettingKeys = snapshot.settings.overriddenSettingKeys + SlicerSettings.Keys.FIRMWARE_RETRACTION,
                    ).also(stateStore::saveSettings)
                } else {
                    snapshot.settings
                }''',
          '''                // Calibration-specific firmware retraction belongs only to the
                // temporary slice snapshot. Generating a test must not mutate the
                // user's persisted printer/profile settings.
                val settings = snapshot.settings''')
          replace_once(vm,
              '                            if (result.requiresFirmwareRetraction) append(" · firmware retraction enabled")',
              '                            if (result.requiresFirmwareRetraction) append(" · firmware retraction enabled for this calibration slice only")')

          tower = 'app/src/main/java/com/tomppi/enderslicer/calibration/CalibrationTowerGenerator.kt'
          replace_once(tower,
              '        CalibrationSliceState.activate(spec.type, values.first())\n        val builder = MeshBuilder()',
              '        val builder = MeshBuilder()')
          replace_once(tower,
          '''        val first = format(values.first())
        val last = format(values.last())
        return CalibrationTowerResult(
            mesh = builder.finish("${spec.type.name.lowercase(Locale.US)}-calibration-$first-to-$last.stl"),''',
          '''        val first = format(values.first())
        val last = format(values.last())
        // Do not arm calibration mode until the generated mesh is valid. A
        // failed generator must never affect the next ordinary slice.
        val mesh = builder.finish("${spec.type.name.lowercase(Locale.US)}-calibration-$first-to-$last.stl")
        CalibrationSliceState.activate(spec.type, values.first())
        return CalibrationTowerResult(
            mesh = mesh,''')
          PY
      - name: Commit to calibration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tomppi/enderslicer/ui/MainViewModel.kt app/src/main/java/com/tomppi/enderslicer/calibration/CalibrationTowerGenerator.kt
          git diff --cached --check
          git commit -m "Keep calibration state temporary [calibration-finalized]"
          git push origin HEAD:fix/calibration-retraction-size
