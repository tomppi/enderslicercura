name: Apply Smart Infill follow-up patch

on:
  push:
    branches:
      - fix/smart-infill-audit-round
    paths:
      - .github/workflows/apply-smart-infill-followup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: retry verified Smart Infill follow-up patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smart-infill-audit-round
          fetch-depth: 0

      - name: Apply patch
        run: |
          sed -i '/^index .*\.\.0000000/d' scripts/smart-infill-followup.patch
          git apply --check scripts/smart-infill-followup.patch
          git apply scripts/smart-infill-followup.patch
          git diff --check

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts/prepare-filasim-assets.py build.gradle.kts .github/workflows/build.yml
          git rm scripts/smart-infill-followup.patch
          git commit -m "fix: restore Smart Infill placement and workspace controls"
          git push origin HEAD:fix/smart-infill-audit-round
