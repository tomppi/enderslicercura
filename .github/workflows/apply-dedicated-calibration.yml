name: Apply dedicated calibration models

on:
  push:
    branches:
      - agent/advanced-slicing-tools
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dedicated-calibration-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    if: (github.event_name == 'push' && github.ref_name == 'agent/advanced-slicing-tools') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/advanced-slicing-tools')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/advanced-slicing-tools
          fetch-depth: 1

      - name: Install dedicated calibration source
        shell: bash
        run: |
          set -euxo pipefail
          test -f .agent-dedicated/generator.b64 || exit 0
          base64 --decode .agent-dedicated/generator.b64 | gzip --decompress > app/src/main/java/com/tomppi/enderslicer/calibration/CalibrationTowerGenerator.kt
          base64 --decode .agent-dedicated/ui.b64 | gzip --decompress > app/src/main/java/com/tomppi/enderslicer/ui/CalibrationGeneratorSheet.kt
          base64 --decode .agent-dedicated/test.b64 | gzip --decompress > app/src/test/java/com/tomppi/enderslicer/calibration/CalibrationTowerGeneratorTest.kt
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
              '- Built-in temperature, flow, speed, fan and firmware-retraction calibration towers',
              '- Purpose-built temperature, flow, speed, fan and firmware-retraction calibration models',
          )
          text = text.replace(
              'Open **Menu → Calibration generator** to create a stepped temperature, flow, speed-factor, fan or firmware-retraction tower. Each generated STL includes visible section markers and schedules the matching G-code value changes automatically when sliced. Retraction towers enable firmware retraction and change `M207` distance while retaining the configured retraction speed.',
              'Open **Menu → Calibration generator** to create a purpose-built model for the selected test. Temperature models repeat bridges, sloped overhangs and thin fins; flow models use thin walls, top-surface coupons and measurement ribs; speed models use a sharp multi-point star; fan models repeat long bridges and progressive cantilevers; and retraction models use isolated posts that force travel moves and expose stringing. Every model schedules the matching G-code value changes automatically when sliced. Retraction models enable firmware retraction and change `M207` distance while retaining the configured retraction speed.',
          )
          path.write_text(text)
          PY
          rm -rf .agent-dedicated
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md app/src/main/java/com/tomppi/enderslicer/calibration/CalibrationTowerGenerator.kt app/src/main/java/com/tomppi/enderslicer/ui/CalibrationGeneratorSheet.kt app/src/test/java/com/tomppi/enderslicer/calibration/CalibrationTowerGeneratorTest.kt .agent-dedicated
          git commit -m "Add purpose-built calibration models"
          git push origin HEAD:agent/advanced-slicing-tools
