name: Run calibration audit patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calibration-retraction-size
          fetch-depth: 0

      - name: Extract and run audited patch
        run: |
          awk '
            /python3 - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/calibration-fix-bootstrap.yml > /tmp/calibration_patch.py
          test -s /tmp/calibration_patch.py
          python3 /tmp/calibration_patch.py

      - name: Commit fixes to calibration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix calibration slicing and shorten test prints [calibration-fix]"
          git push origin HEAD:fix/calibration-retraction-size
