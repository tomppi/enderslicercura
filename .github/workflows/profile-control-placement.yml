name: Validate profile and OctoPrint placement

on:
  push:
    branches:
      - feature/profile-filament-management

permissions:
  contents: write

concurrency:
  group: profile-control-placement
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-filament-management

      - name: Apply control placement update
        run: python scripts/move_profile_octoprint_controls.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and native build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y ninja-build file binutils

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-curaengine-5.11-beta1-android-arm64-v5-${{ hashFiles('scripts/build-curaengine-android.sh', 'native/curaengine/profiles/android-arm64') }}
          restore-keys: |
            conan-curaengine-5.11-beta1-android-arm64-v5-
            conan-curaengine-5.11-android-arm64-v4-

      - name: Fetch and validate pinned Cura definitions
        run: |
          chmod +x scripts/fetch-cura-resources.sh
          scripts/fetch-cura-resources.sh
          grep -q 'Cura resources: 5.11.0-beta.1' app/src/main/assets/cura/definitions/version.txt

      - name: Prepare pinned BumpMesh workspace
        run: |
          gradle :app:prepareBumpMeshAssets --stacktrace
          test -s app/src/main/assets/bumpmesh/index.html
          test -s app/src/main/assets/bumpmesh/android-bridge.js

      - name: Build and package CuraEngine ARM64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          APP_JNILIBS_DIR: ${{ github.workspace }}/app/src/main/jniLibs
        run: |
          chmod +x scripts/build-curaengine-android.sh
          set -o pipefail
          scripts/build-curaengine-android.sh 2>&1 | tee curaengine-android-build.log
          test -s app/src/main/jniLibs/arm64-v8a/libcuraengine_exec.so

      - name: Run unit tests and compile Compose integration
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee apk-build.log
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-contents.log
          grep -q 'lib/arm64-v8a/libcuraengine_exec.so' apk-contents.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: enderslicercura-profile-menu-octoprint-top-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Remove one-time validation files and commit
        run: |
          rm -f scripts/move_profile_octoprint_controls.py
          rm -f .github/workflows/profile-control-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move profiles to menu and OctoPrint to top center"
          git push origin HEAD:feature/profile-filament-management
