name: Apply bug audit follow-up

on:
  push:
    branches:
      - agent/full-octoprint-integration
    paths:
      - scripts/apply_bug_audit_followup.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-octoprint-integration
          fetch-depth: 0
      - name: Apply follow-up fixes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/apply_bug_audit_followup.py ]]; then
            exit 0
          fi
          python3 scripts/apply_bug_audit_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- scripts/apply_bug_audit_followup.py
          git add -- \
            app/src/main/java/com/tomppi/enderslicer/octoprint/OctoPrintRepository.kt \
            app/src/main/java/com/tomppi/enderslicer/ui/OctoPrintSheet.kt \
            docs/bug-audit.md
          git commit -m "Finish OctoPrint runtime safety audit"
          git push origin HEAD:agent/full-octoprint-integration
