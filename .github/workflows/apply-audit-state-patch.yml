name: Apply audit state patch

on:
  push:
    branches:
      - fix/app-bug-audit
    paths:
      - .github/workflows/apply-audit-state-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-bug-audit
          fetch-depth: 0
      - name: Apply state patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/state.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/state.patch.gz.b64 | gzip -d > /tmp/state.patch
          git apply --check /tmp/state.patch
          git apply /tmp/state.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tomppi/enderslicer/ui/MainViewModel.kt app/src/main/java/com/tomppi/enderslicer/ui/EnderSlicerApp.kt
          git commit -m "Make app operations transactional"
          git push origin HEAD:fix/app-bug-audit
