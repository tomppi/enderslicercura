name: Finalize calibration state handling

on:
  push:
    branches: [fix/calibration-retraction-size]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[calibration-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calibration-retraction-size
          fetch-depth: 0
      - name: Apply final calibration fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1))

          vm = 'app/src/main/java/com/tomppi/enderslicer/ui/MainViewModel.kt'
          replace_once(
              vm,
              '''                val settings = if (result.requiresFirmwareRetraction && !snapshot.settings.firmwareRetraction) {
                    snapshot.settings.copy(
                        firmwareRetraction = true,
                        overriddenSettingKeys = snapshot.settings.overriddenSettingKeys + SlicerSettings.Keys.FIRMWARE_RETRACTION,
                    ).also(stateStore::saveSettings)
                } else {
                    snapshot.settings
                }''',
              '''                // Calibration-specific firmware retraction is applied only to the
                // temporary slice snapshot. Generating a test model must never mutate
                // the user's persisted printer/profile settings.
                val settings = snapshot.settings''',
          )
          replace_once(
              vm,
              '                            if (result.requiresFirmwareRetraction) append(" · firmware retraction enabled")',
              '                            if (result.requiresFirmwareRetraction) append(" · firmware retraction enabled for this calibration slice only")',
          )

          tower = 'app/src/main/java/com/tomppi/enderslicer/calibration/CalibrationTowerGenerator.kt'
          replace_once(tower, '        CalibrationSliceState.activate(spec.type, values.first())\n        val builder = MeshBuilder()', '        val builder = MeshBuilder()')
          replace_once(
              tower,
              '''        val first = format(values.first())
        val last = format(values.last())
        return CalibrationTowerResult(
            mesh = builder.finish("${spec.type.name.lowercase(Locale.US)}-calibration-$first-to-$last.stl"),''',
              '''        val first = format(values.first())
        val last = format(values.last())
        // Only arm calibration behavior after all geometry has been built and
        // validated. A failed generator must not poison a later normal slice.
        val mesh = builder.finish("${spec.type.name.lowercase(Locale.US)}-calibration-$first-to-$last.stl")
        CalibrationSliceState.activate(spec.type, values.first())
        return CalibrationTowerResult(
            mesh = mesh,''',
          )

          doc = Path('docs/calibration-audit.md')
          text = doc.read_text()
          if 'firmware state' not in text.lower():
              text += '''\n- Speed and flow factors are restored to 100% at EOF; fan is forced off, and retraction restores the configured M207 distance/speed.\n- Generating a retraction model no longer persists firmware-retraction changes into the user profile.\n- Calibration mode is armed only after geometry generation succeeds.\n'''
              doc.write_text(text)

          Path('.github/workflows/calibration-finalize.yml').unlink()
          PY
      - name: Commit finalized calibration fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize calibration state safety [calibration-finalized]"
          git push origin HEAD:fix/calibration-retraction-size
