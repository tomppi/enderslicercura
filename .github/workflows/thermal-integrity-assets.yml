name: Thermal Integrity Asset and APK Checks

on:
  push:
    branches:
      - feature/thermal-integrity-simulation
  pull_request:
    branches:
      - feature/thermal-fea-build-simulation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thermal-integrity-assets-${{ github.ref }}
  cancel-in-progress: true

env:
  FILASIM_COMMIT: e7485ec22d4ebe8baca04190404fbb877c90e031
  NODE_VERSION: 22.18.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  package-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Validate preparation scripts
        run: |
          python3 -m py_compile \
            scripts/prepare-filasim-assets-with-thermal-integrity-v8.py \
            scripts/filasim-thermal-integrity-patch.py \
            scripts/filasim-thermal-integrity-hardening.py \
            scripts/filasim-thermal-integrity-audit-fixes.py

      - name: Prepare verified format-8 thermal filaSim assets
        run: python3 scripts/prepare-filasim-assets-with-thermal-integrity-v8.py

      - name: Verify generated thermal asset contract
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/assets/filasim
          marker="$root/.thermal-integrity-version"

          test -f "$root/.source-version"
          grep -qx 'format=8' "$root/.source-version"
          grep -qx "commit=${FILASIM_COMMIT}" "$root/.source-version"
          test -s "$root/thermal-integrity.js"
          grep -q 'enderslicer-thermal-integrity' "$root/thermal-integrity.js"
          grep -q 'fdm-service-thermal-integrity' "$root/thermal-integrity.js"
          grep -q '<script src="./thermal-integrity.js"></script>' "$root/index.html"

          test -s "$marker"
          grep -qx 'format=1' "$marker"
          grep -qx "filasim=${FILASIM_COMMIT}" "$marker"
          grep -qx 'transforms=solver,hardening,audit-fixes' "$marker"
          grep -q 'thermal-integrity.js' "$root/SHA256SUMS"
          grep -q '.thermal-integrity-version' "$root/SHA256SUMS"

          wasm=$(find "$root/assets" -type f -name '*.wasm' -print -quit)
          test -n "$wasm"
          test -s "$wasm"
          test -n "$(find "$root/assets" -type f -name '*.js' -print -quit)"

      - name: Run Android tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify packaged APK runtime
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)
          test -n "$apk"

          unzip -p "$apk" assets/filasim/index.html > "$RUNNER_TEMP/index.html"
          unzip -p "$apk" assets/filasim/thermal-integrity.js > "$RUNNER_TEMP/thermal-integrity.js"
          unzip -p "$apk" assets/filasim/.thermal-integrity-version > "$RUNNER_TEMP/thermal-version"
          unzip -p "$apk" assets/filasim/SHA256SUMS > "$RUNNER_TEMP/SHA256SUMS"

          grep -q '<script src="./thermal-integrity.js"></script>' "$RUNNER_TEMP/index.html"
          grep -q 'enderslicer-thermal-integrity' "$RUNNER_TEMP/thermal-integrity.js"
          grep -q 'fdm-service-thermal-integrity' "$RUNNER_TEMP/thermal-integrity.js"
          grep -qx 'format=1' "$RUNNER_TEMP/thermal-version"
          grep -qx "filasim=${FILASIM_COMMIT}" "$RUNNER_TEMP/thermal-version"
          grep -qx 'transforms=solver,hardening,audit-fixes' "$RUNNER_TEMP/thermal-version"
          grep -q 'thermal-integrity.js' "$RUNNER_TEMP/SHA256SUMS"
          grep -q '.thermal-integrity-version' "$RUNNER_TEMP/SHA256SUMS"

          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          test -n "$(awk '/^assets\/filasim\/.*\.wasm$/ { print; exit }' "$RUNNER_TEMP/apk-entries.txt")"
          test -n "$(awk '/^assets\/filasim\/assets\/.*\.js$/ { print; exit }' "$RUNNER_TEMP/apk-entries.txt")"

      - name: Upload thermal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: enderslicercura-thermal-integrity-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
