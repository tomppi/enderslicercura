name: Thermal Integrity Asset Checks

on:
  push:
    branches:
      - feature/thermal-integrity-simulation
  pull_request:
    branches:
      - feature/thermal-fea-build-simulation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thermal-integrity-assets-${{ github.ref }}
  cancel-in-progress: true

env:
  FILASIM_COMMIT: e7485ec22d4ebe8baca04190404fbb877c90e031
  NODE_VERSION: 22.18.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  validate-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pinned wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Validate preparation scripts
        run: |
          python3 -m py_compile \
            scripts/prepare-filasim-assets-with-thermal-integrity-v8.py \
            scripts/filasim-thermal-integrity-patch.py \
            scripts/filasim-thermal-integrity-hardening.py \
            scripts/filasim-thermal-integrity-audit-fixes.py \
            scripts/filasim-thermal-integrity-progress.py
          node --check app/src/main/filasim/thermal-integrity.js
          node --check app/src/main/filasim/thermal-integrity-workspace.js

      - name: Prepare verified format-8 thermal filaSim assets
        run: python3 scripts/prepare-filasim-assets-with-thermal-integrity-v8.py

      - name: Verify generated thermal asset contract
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/assets/filasim
          marker="$root/thermal-integrity-version.txt"

          test -f "$root/.source-version"
          grep -qx 'format=8' "$root/.source-version"
          grep -qx "commit=${FILASIM_COMMIT}" "$root/.source-version"
          test -s "$root/thermal-integrity.js"
          test -s "$root/thermal-integrity-workspace.js"
          grep -q 'enderslicer-thermal-integrity' "$root/thermal-integrity.js"
          grep -q 'fdm-service-thermal-integrity' "$root/thermal-integrity.js"
          grep -q 'enderslicer-thermal-integrity-tab' "$root/thermal-integrity-workspace.js"
          grep -q 'ti-progress-bar' "$root/thermal-integrity-workspace.js"
          grep -q '<script src="./thermal-integrity-workspace.js"></script>' "$root/index.html"
          grep -q '<script src="./thermal-integrity.js"></script>' "$root/index.html"
          test "$(grep -n 'thermal-integrity-workspace.js' "$root/index.html" | cut -d: -f1)" -le "$(grep -n 'thermal-integrity.js' "$root/index.html" | cut -d: -f1)"

          test -s "$marker"
          grep -qx 'format=1' "$marker"
          grep -qx "filasim=${FILASIM_COMMIT}" "$marker"
          grep -qx 'transforms=solver,hardening,audit-fixes,progress' "$marker"
          grep -q 'thermal-integrity.js' "$root/SHA256SUMS"
          grep -q 'thermal-integrity-workspace.js' "$root/SHA256SUMS"
          grep -q 'thermal-integrity-version.txt' "$root/SHA256SUMS"

          wasm=$(find "$root/assets" -type f -name '*.wasm' -print -quit)
          test -n "$wasm"
          test -s "$wasm"
          test -n "$(find "$root/assets" -type f -name '*.js' -print -quit)"

      - name: Run thermal report unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.tomppi.enderslicer.smartinfill.ThermalIntegrityReportTest' \
            -x :app:verifyCuraEngineExecutable
