name: Apply arc preview color

on:
  push:
    branches:
      - agent/native-arc-overhang
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-preview-color-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-arc-overhang
          fetch-depth: 1

      - name: Apply dedicated arc-overhang preview feature
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'ARC_OVERHANG(5)' app/src/main/java/com/tomppi/enderslicer/engine/GcodeLayerPreview.kt; then
            echo 'Arc preview color patch is already applied.'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected context not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          # Preserve a dedicated marker from CuraEngine through the generated G-code.
          build_script = "scripts/build-curaengine-android.sh"
          replace_once(
              build_script,
              '''# Install the native arc-overhang source and register it with CuraEngine.
          (root / "include" / "ArcOverhang.h").write_text((arc_patch_root / "include" / "ArcOverhang.h").read_text())
          (root / "src" / "ArcOverhang.cpp").write_text((arc_patch_root / "src" / "ArcOverhang.cpp").read_text())
          ''',
              '''# Install the native arc-overhang source and register it with CuraEngine.
          (root / "include" / "ArcOverhang.h").write_text((arc_patch_root / "include" / "ArcOverhang.h").read_text())
          (root / "src" / "ArcOverhang.cpp").write_text((arc_patch_root / "src" / "ArcOverhang.cpp").read_text())

          # Keep arc overhangs as real skin for Cura's estimates and motion behaviour,
          # but carry one private flag so the G-code writer can emit an exact preview marker.
          gcode_path_config_h = root / "include" / "GCodePathConfig.h"
          replace(
              gcode_path_config_h,
              '''    bool is_bridge_path{ false }; //!< whether current config is used when bridging
              double fan_speed{ FAN_SPEED_DEFAULT }; //!< fan speed override for this path, value should be within range 0-100 (inclusive) and ignored otherwise''',
              '''    bool is_bridge_path{ false }; //!< whether current config is used when bridging
              bool is_arc_overhang{ false }; //!< EnderSlicer native Multiplex path; used only for an exact G-code preview marker
              double fan_speed{ FAN_SPEED_DEFAULT }; //!< fan speed override for this path, value should be within range 0-100 (inclusive) and ignored otherwise''',
          )

          layer_plan_cpp = root / "src" / "LayerPlan.cpp"
          replace(
              layer_plan_cpp,
              '''            const auto& extruder_changed = ! last_extrusion_config.has_value() || (last_extrusion_config.value().type != path.config.type);
              if (! path.config.isTravelPath() && extruder_changed)
              {
                  gcode.writeTypeComment(path.config.type);
                  if (path.config.isBridgePath())
                  {
                      gcode.writeComment("BRIDGE");
                  }
                  last_extrusion_config = path.config;
                  update_extrusion_offset = true;
              }''',
              '''            const bool feature_changed = ! last_extrusion_config.has_value()
                                              || last_extrusion_config.value().type != path.config.type
                                              || last_extrusion_config.value().is_arc_overhang != path.config.is_arc_overhang;
              if (! path.config.isTravelPath() && feature_changed)
              {
                  if (path.config.is_arc_overhang)
                  {
                      // App-owned semantic marker. Firmware ignores comments, while
                      // EnderSlicer's layer preview can classify these paths exactly.
                      gcode.writeComment("TYPE:ARC-OVERHANG");
                  }
                  else
                  {
                      gcode.writeTypeComment(path.config.type);
                  }
                  if (path.config.isBridgePath())
                  {
                      gcode.writeComment("BRIDGE");
                  }
                  last_extrusion_config = path.config;
                  update_extrusion_offset = true;
              }''',
          )
          ''',
          )
          replace_once(
              build_script,
              '''            GCodePathConfig arc_config = *skin_config;
                      arc_config.speed_derivatives.speed = mesh.settings.get<Velocity>("enderslicer_arc_overhang_speed");''',
              '''            GCodePathConfig arc_config = *skin_config;
                      arc_config.is_arc_overhang = true;
                      arc_config.speed_derivatives.speed = mesh.settings.get<Velocity>("enderslicer_arc_overhang_speed");''',
          )

          # Parse the exact marker as its own semantic preview feature.
          parser = "app/src/main/java/com/tomppi/enderslicer/engine/GcodeLayerPreview.kt"
          replace_once(
              parser,
              '''        ADHESION(3),
                  OTHER(4),''',
              '''        ADHESION(3),
                  OTHER(4),
                  ARC_OVERHANG(5),''',
          )
          replace_once(
              parser,
              '''        return when {
                      value.contains("SUPPORT-INTERFACE") || value.contains("SUPPORT_INTERFACE") -> {''',
              '''        return when {
                      value.contains("ARC-OVERHANG") || value.contains("ARC_OVERHANG") -> {
                          GcodeLayerPreview.Feature.ARC_OVERHANG
                      }
                      value.contains("SUPPORT-INTERFACE") || value.contains("SUPPORT_INTERFACE") -> {''',
          )

          # Use semantic colors for both the selected layer and translucent build-up paths.
          renderer = "app/src/main/java/com/tomppi/enderslicer/viewer/LayerPreviewSurfaceView.kt"
          replace_once(renderer, '''        val colorCache = HashMap<Int, FloatArray>()
          ''', '')
          replace_once(
              renderer,
              '''                val color = colorCache.getOrPut(speed.toBits()) {
                              speedColor(
                                  speed = speed,
                                  minimum = value.minSpeedMmPerSecond,
                                  maximum = value.maxSpeedMmPerSecond,
                              )
                          }''',
              '''                val color = previewColor(
                              feature = feature,
                              speed = speed,
                              minimum = value.minSpeedMmPerSecond,
                              maximum = value.maxSpeedMmPerSecond,
                          )''',
          )
          replace_once(
              renderer,
              '''            val color = when (feature) {
                          GcodeLayerPreview.Feature.SUPPORT -> floatArrayOf(0.15f, 0.95f, 1f, 1f)
                          GcodeLayerPreview.Feature.SUPPORT_INTERFACE -> floatArrayOf(1f, 0.25f, 0.9f, 1f)
                          GcodeLayerPreview.Feature.ADHESION -> floatArrayOf(1f, 0.62f, 0.08f, 1f)
                          else -> speedColor(speed, current.minSpeedMmPerSecond, current.maxSpeedMmPerSecond)
                      }''',
              '''            val color = previewColor(
                          feature = feature,
                          speed = speed,
                          minimum = current.minSpeedMmPerSecond,
                          maximum = current.maxSpeedMmPerSecond,
                      )''',
          )
          replace_once(
              renderer,
              '''    private fun speedColor(speed: Float, minimum: Float, maximum: Float): FloatArray {''',
              '''    private fun previewColor(
                  feature: GcodeLayerPreview.Feature,
                  speed: Float,
                  minimum: Float,
                  maximum: Float,
              ): FloatArray = when (feature) {
                  GcodeLayerPreview.Feature.SUPPORT -> floatArrayOf(0.15f, 0.95f, 1f, 1f)
                  GcodeLayerPreview.Feature.SUPPORT_INTERFACE -> floatArrayOf(1f, 0.25f, 0.9f, 1f)
                  GcodeLayerPreview.Feature.ADHESION -> floatArrayOf(1f, 0.62f, 0.08f, 1f)
                  // Violet is outside the blue-to-red speed gradient and is not used
                  // by support, interface, or adhesion paths.
                  GcodeLayerPreview.Feature.ARC_OVERHANG -> floatArrayOf(0.72f, 0.38f, 1f, 1f)
                  else -> speedColor(speed, minimum, maximum)
              }

              private fun speedColor(speed: Float, minimum: Float, maximum: Float): FloatArray {''',
          )

          replace_once(
              "app/src/main/java/com/tomppi/enderslicer/ui/LayerPreviewView.kt",
              '''                    "The selected layer is rendered as thick ribbons with a dark outline. Cyan is support, magenta is support interface, and orange is adhesion.",''',
              '''                    "The selected layer is rendered as thick ribbons with a dark outline. Violet is a Multiplex arc overhang, cyan is support, magenta is support interface, and orange is adhesion.",''',
          )

          # Parser regression coverage for the private TYPE marker.
          test = "app/src/test/java/com/tomppi/enderslicer/engine/GcodeLayerPreviewParserTest.kt"
          replace_once(
              test,
              '''    @Test
              fun cappedPreviewSamplesAllLayersInsteadOfDroppingTheTopOfThePrint() {''',
              '''    @Test
              fun parsesArcOverhangMarkerAsDedicatedPreviewFeature() {
                  val file = kotlin.io.path.createTempFile("enderslicer-arc-preview", ".gcode")
                      .toFile()
                      .apply {
                          writeText(
                              """
                              G90
                              M82
                              G92 E0
                              ;LAYER:0
                              G1 X0 Y0 Z0.2 F3000
                              ;TYPE:ARC-OVERHANG
                              G1 X10 Y0 E1 F300
                              """.trimIndent(),
                          )
                      }

                  val preview = GcodeLayerPreviewParser.parse(file)
                  val featureCode = preview.layers.single().segments[5].toInt()

                  assertEquals(GcodeLayerPreview.Feature.ARC_OVERHANG.code, featureCode)
              }

              @Test
              fun cappedPreviewSamplesAllLayersInsteadOfDroppingTheTopOfThePrint() {''',
          )

          replace_once(
              ".github/workflows/build.yml",
              '''          grep -q 'One centre is retained for the complete connected island' .build/CuraEngine/include/ArcOverhang.h
                    test -s .build/CuraEngine/src/ArcOverhang.cpp''',
              '''          grep -q 'One centre is retained for the complete connected island' .build/CuraEngine/include/ArcOverhang.h
                    grep -q 'TYPE:ARC-OVERHANG' .build/CuraEngine/src/LayerPlan.cpp
                    grep -q 'is_arc_overhang' .build/CuraEngine/include/GCodePathConfig.h
                    test -s .build/CuraEngine/src/ArcOverhang.cpp''',
          )
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-curaengine-android.sh .github/workflows/build.yml app/src/main/java app/src/test/java
          git commit -m 'Color native arc overhangs in layer preview'
          git push origin HEAD:agent/native-arc-overhang
