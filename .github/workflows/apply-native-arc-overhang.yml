name: Apply native arc overhang

on:
  push:
    branches:
      - agent/native-arc-overhang
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-arc-overhang-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-arc-overhang
          fetch-depth: 1

      - name: Validate and apply native Multiplex port
        shell: bash
        run: |
          set -uo pipefail
          expected_b64='684a0eb1ca2c9ad05d064202574e225b094e5a7246578d24915577b3803c3512'
          expected_py='0c06709898ed30a668e26edff374e1272c5892fac023cb6a105e7a621ba3ee46'
          : > .agent-native-arc/diagnostics.txt
          rm -f .agent-native-arc/patch.b64 .agent-native-arc/patch.py

          for source in .agent-native-arc/part-*.b64; do
            clean="${source}.clean"
            tr -d '[:space:]' < "$source" > "$clean"
            sha256sum "$clean" >> .agent-native-arc/diagnostics.txt
            cat "$clean" >> .agent-native-arc/patch.b64
          done

          actual_b64="$(sha256sum .agent-native-arc/patch.b64 | cut -d' ' -f1)"
          decode_ok=false
          compile_ok=false
          if base64 --decode .agent-native-arc/patch.b64 > .agent-native-arc/patch.py 2>> .agent-native-arc/diagnostics.txt; then
            decode_ok=true
            actual_py="$(sha256sum .agent-native-arc/patch.py | cut -d' ' -f1)"
            if python3 -m py_compile .agent-native-arc/patch.py >> .agent-native-arc/diagnostics.txt 2>&1; then
              compile_ok=true
            fi
          else
            actual_py='decode-failed'
          fi

          {
            echo "expected_b64=$expected_b64"
            echo "actual_b64=$actual_b64"
            echo "expected_py=$expected_py"
            echo "actual_py=$actual_py"
            echo "decode_ok=$decode_ok"
            echo "compile_ok=$compile_ok"
          } >> .agent-native-arc/diagnostics.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [[ "$actual_b64" == "$expected_b64" && "$actual_py" == "$expected_py" && "$compile_ok" == true ]]; then
            set -euxo pipefail
            python3 .agent-native-arc/patch.py
            rm -rf .agent-native-arc
            rm -f .github/workflows/apply-native-arc-overhang.yml
            git add -A
            git commit -m 'Port native Multiplex arc overhangs to CuraEngine'
            git push origin HEAD:agent/native-arc-overhang
          else
            rm -f .agent-native-arc/*.clean .agent-native-arc/patch.b64 .agent-native-arc/patch.py
            rm -f .github/workflows/apply-native-arc-overhang.yml
            git add .agent-native-arc/diagnostics.txt .github/workflows/apply-native-arc-overhang.yml
            git commit -m 'Record native arc payload diagnostics'
            git push origin HEAD:agent/native-arc-overhang
            exit 1
          fi
