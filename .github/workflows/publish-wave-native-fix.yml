name: Publish final wave overhang hardening

on:
  pull_request:
    types: [synchronize]
    branches: [fix/bug-fix-round-2]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'feature/wave-overhangs-viewer-fit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tomppi/enderslicercura
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply final safety and preset hardening
        run: python3 scripts/harden-wave-overhang.py

      - name: Verify and publish
        run: |
          grep -q 'reverse_direction' native/curaengine/patches/include/WaveOverhang.h
          grep -q 'WAVE_OVERHANG_MAX_ITERATIONS' app/src/main/java/com/tomppi/enderslicer/profile/PresetSettings.kt
          grep -q 'Arc and Wave overhangs cannot both be enabled' app/src/main/java/com/tomppi/enderslicer/profile/PresetValueSanitizer.kt
          test -s app/src/test/java/com/tomppi/enderslicer/profile/WaveOverhangPresetTest.kt
          git diff --check
          rm scripts/harden-wave-overhang.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve wave support order and preset state"
          git push origin HEAD:feature/wave-overhangs-viewer-fit
