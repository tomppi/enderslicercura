name: Apply configurable mesh limit

on:
  push:
    branches:
      - agent/configurable-triangle-limit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: configurable-mesh-limit-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/configurable-triangle-limit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/configurable-triangle-limit
          fetch-depth: 1

      - name: Apply implementation
        shell: bash
        run: |
          set -euxo pipefail
          test -f .agent-meshlimit/bundle.b64 || exit 0
          base64 --decode .agent-meshlimit/bundle.b64 > /tmp/mesh-limit-bundle.tar.gz
          tar -xzf /tmp/mesh-limit-bundle.tar.gz
          python3 .agent-meshlimit/patch.py
          rm -rf .agent-meshlimit

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md app/build.gradle.kts app/src/main app/src/test .agent-meshlimit
          git commit -m "Add configurable mesh triangle limits"
          git push origin HEAD:agent/configurable-triangle-limit
